[build]
  publish = "."
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Keep one preferred homepage URL per language.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true
[[redirects]]
  from = "/ru/index.html"
  to = "/ru/"
  status = 301
  force = true
[[redirects]]
  from = "https://www.kompaktweb.rs/*"
  to = "https://kompaktweb.rs/:splat"
  status = 301
  force = true
